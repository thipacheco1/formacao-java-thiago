<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Decisão segura antes de restaurar uma alteração</title>
  <desc id="desc">Fluxograma para revisar git diff e escolher entre manter, tirar da staging ou descartar uma alteração.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748b" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1280" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" fill="#172033" font-family="Segoe UI, Arial" font-size="32" font-weight="700">Antes de restaurar: veja, decida, confirme</text>
  <text x="64" y="100" fill="#64748b" font-family="Segoe UI, Arial" font-size="18">O Git não adivinha sua intenção. Você precisa escolher se quer preservar ou descartar a mudança.</text>

  <g filter="url(#shadow)">
    <rect x="430" y="142" width="420" height="98" rx="20" fill="#172033"/>
    <text x="640" y="181" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="22">git diff</text>
    <text x="640" y="213" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="17">leia as linhas que serão afetadas</text>
  </g>
  <line x1="640" y1="240" x2="640" y2="287" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="294" width="420" height="88" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="640" y="333" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial" font-size="21" font-weight="700">O que você quer fazer?</text>
    <text x="640" y="360" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="16">não execute o próximo comando no automático</text>
  </g>

  <path d="M430 338 C340 338 300 390 300 430" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M640 382 L640 430" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M850 338 C940 338 980 390 980 430" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="440" width="360" height="126" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="272" y="476" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Manter e commitar</text>
    <text x="272" y="512" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-size="17">git add arquivo</text>
    <text x="272" y="540" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-size="17">git commit -m "..."</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="440" width="360" height="126" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="640" y="476" text-anchor="middle" fill="#5b21b6" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Manter, mas tirar da staging</text>
    <text x="640" y="515" text-anchor="middle" fill="#6d28d9" font-family="Consolas, monospace" font-size="16">git restore --staged arquivo</text>
    <text x="640" y="542" text-anchor="middle" fill="#7c3aed" font-family="Segoe UI, Arial" font-size="15">o conteúdo continua no arquivo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="828" y="440" width="360" height="126" rx="20" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
    <text x="1008" y="476" text-anchor="middle" fill="#9f1239" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Descartar a alteração</text>
    <text x="1008" y="515" text-anchor="middle" fill="#be123c" font-family="Consolas, monospace" font-size="17">git restore arquivo</text>
    <text x="1008" y="542" text-anchor="middle" fill="#e11d48" font-family="Segoe UI, Arial" font-size="15">mudança não commitada será perdida</text>
  </g>
</svg>
