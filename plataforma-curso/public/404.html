<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#111827" />
    <title>Página não encontrada | Formação Java Backend</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #526078; background: radial-gradient(circle at 80% 10%, #dce6ff, transparent 34rem), #eef2f7; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(660px, 100%); padding: clamp(28px, 7vw, 58px); background: #fff; border: 1px solid #dce3ee; border-radius: 24px; box-shadow: 0 24px 64px rgba(37, 51, 80, .1); }
      small { color: #315bb9; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 13px 0; color: #172238; font-size: clamp(2rem, 8vw, 3.7rem); line-height: 1.02; letter-spacing: -.05em; }
      p { margin: 0; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
      a { padding: 10px 14px; color: #fff; background: #315bb9; border: 1px solid #315bb9; border-radius: 10px; font-weight: 750; text-decoration: none; }
      a + a { color: #43516a; background: #f5f7fb; border-color: #dce3ee; }
    </style>
  </head>
  <body>
    <main>
      <small>Erro 404</small>
      <h1>Esta página não existe.</h1>
      <p>O endereço pode ter mudado. Volte à plataforma ou consulte o currículo público da formação.</p>
      <nav aria-label="Próximos caminhos">
        <a href="/">Ir para a plataforma</a>
        <a href="/trilhas">Explorar o currículo</a>
      </nav>
    </main>
  </body>
</html>
